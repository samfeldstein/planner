<!doctype html>
<meta charset="utf-8">
<title>Check-off with options open</title>
<pre id="out">running…</pre>
<iframe id="app" style="width:400px;height:700px"></iframe>
<script type="module">
// Regression: expanding a row's options and then checking it off must still save the completion.
// Once threw in render() before the save, so a monthly todo never moved and came back every day.
import { createIdbAdapter } from '../../src/js/data/db.js';
import { todayLocal } from '../../src/js/core/date.js';

const failures = [];
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, what, ms = 8000) {
  for (let t = 0; t < ms; t += 50) {
    const v = await fn();
    if (v) return v;
    await wait(50);
  }
  failures.push(`timed out waiting for ${what}`);
  return null;
}

async function run() {
  await new Promise((res) => { const r = indexedDB.deleteDatabase('planner'); r.onsuccess = r.onerror = r.onblocked = res; });
  localStorage.removeItem('planner:finished');
  localStorage.removeItem('planner:upcomingOpen');

  const [y, m] = todayLocal().split('-').map(Number);
  const pad = (n) => String(n).padStart(2, '0');
  const due = `${y}-${pad(m)}-01`; // the 1st of this month: due today or overdue
  const next = m === 12 ? `${y + 1}-01-01` : `${y}-${pad(m + 1)}-01`;
  const stamp = new Date().toISOString();
  const id = 'checkoff-test';
  const adapter = createIdbAdapter();
  await adapter.commit([{ store: 'todos', type: 'put', value: {
    id, title: 'Pay rent', due, part: 'morning', groupId: null, priority: 1,
    recur: { freq: 'monthly', monthDay: 1 }, lastDone: null, createdAt: stamp, updatedAt: stamp,
  } }]);

  const frame = document.getElementById('app');
  frame.src = '../../src/index.html';
  await new Promise((r) => { frame.onload = r; });
  frame.contentWindow.addEventListener('error', (e) => failures.push(`page error: ${e.message}`));
  frame.contentWindow.addEventListener('unhandledrejection', (e) => failures.push(`unhandled rejection: ${e.reason}`));
  const logError = frame.contentWindow.console.error.bind(frame.contentWindow.console);
  frame.contentWindow.console.error = (...args) => { failures.push(`console.error: ${args.join(' ')}`); logError(...args); };
  const doc = frame.contentDocument;
  const row = await until(() => doc.querySelector(`.row[data-id="${id}"]`), 'the todo row');
  if (!row) return;

  row.querySelector('.row-more').click();
  if (row.querySelector('.actions').hidden) failures.push('options did not expand');
  row.querySelector('.task').click();

  const saved = await until(async () => {
    const t = (await adapter.load()).todos.find((x) => x.id === id);
    return t && t.due === next ? t : null;
  }, `due to move to ${next}`);
  if (saved && !saved.lastDone) failures.push('lastDone was not set');
  if (!doc.querySelector(`.row.done[data-id="${id}"]`)) failures.push('row is not drawn as done');

  // Regression: editing the next instance from Upcoming, then undoing the check-off, keeps the
  // edit. Undo used to write back the whole pre-check-off snapshot.
  const upcoming = doc.querySelector(`.upcoming .row[data-id="${id}"] .task`);
  if (!upcoming) { failures.push('checked-off todo is not in Upcoming'); return; }
  doc.querySelector('.upcoming details').open = true;
  upcoming.click();
  const sheet = doc.getElementById('sheet');
  if (!await until(() => sheet.open, 'the edit sheet')) return;
  doc.getElementById('todoText').textContent = 'Pay the rent';
  doc.getElementById('priority').click(); // top priority off
  doc.getElementById('sheetDone').click();
  await until(async () => (await adapter.load()).todos.find((x) => x.id === id)?.title === 'Pay the rent', 'the edit to save');
  const struck = await until(() => doc.querySelector(`.row.done[data-id="${id}"]`), 'the struck row');
  if (!struck?.closest('section.today') || struck.classList.contains('top')) failures.push('struck row did not follow the priority edit');
  if (struck && !struck.textContent.includes('Pay the rent')) failures.push('struck row shows the old title');
  struck?.querySelector('.task').click();
  const undone = await until(async () => {
    const t = (await adapter.load()).todos.find((x) => x.id === id);
    return t && t.due === due ? t : null;
  }, `undo to move due back to ${due}`);
  if (undone && (undone.title !== 'Pay the rent' || undone.priority !== 0)) {
    failures.push(`undo lost the edit: ${undone.title}, priority ${undone.priority}`);
  }

  // Leaving the app puts checked-off todos away in a closed Completed list; undo there brings
  // the todo back unstruck in the list.
  const again = await until(() => doc.querySelector(`.today .row:not(.done)[data-id="${id}"] .task`), 'the undone row');
  if (!again) return;
  again.click();
  await until(async () => (await adapter.load()).todos.find((x) => x.id === id)?.due === next, 'the second check-off to save');
  if (doc.querySelector('.completed')) failures.push('Completed shown before leaving the app');
  frame.contentWindow.dispatchEvent(new frame.contentWindow.PageTransitionEvent('pagehide'));
  const away = await until(() => doc.querySelector(`.completed .row.done[data-id="${id}"]`), 'the row in Completed');
  if (!away) return;
  if (doc.querySelector(`.today .row[data-id="${id}"]`)) failures.push('put-away todo still drawn in the list');
  const details = doc.querySelector('.completed details');
  if (details.open) failures.push('Completed is open after leaving');
  const label = details.querySelector('summary').getAttribute('aria-label');
  if (label !== 'Completed, 1 todo') failures.push(`Completed label: ${label}`);
  if (doc.getElementById('count').textContent !== '1 of 1') failures.push(`header count: ${doc.getElementById('count').textContent}`);
  if (doc.querySelector('.completed').nextElementSibling !== doc.querySelector('.upcoming')) failures.push('Completed is not just above Upcoming');
  const saved2 = JSON.parse(localStorage.getItem('planner:finished'));
  if (!saved2?.away?.includes(id)) failures.push('put-away set was not saved');
  details.open = true;
  away.querySelector('.task').click();
  const back = await until(() => doc.querySelector(`.today .row:not(.done)[data-id="${id}"]`), 'the row back in the list');
  if (back?.classList.contains('top')) failures.push('undone row lost the priority edit');
  if (doc.querySelector('.completed')) failures.push('Completed still shown with nothing in it');
  const restored = (await adapter.load()).todos.find((x) => x.id === id);
  if (restored?.due !== due) failures.push(`undo from Completed did not move due back: ${restored?.due}`);

  // Hiding the page (visibilitychange), focus after a put-away, the tap fallback, "All done for
  // today.", and the launch put-away. The todo is in the list again, unstruck.
  const win = frame.contentWindow;
  const check = (ok, what) => { if (!ok) failures.push(what); };
  const fire = (kind) => {
    if (kind === 'pagehide') win.dispatchEvent(new win.PageTransitionEvent('pagehide'));
    else if (kind === 'hidden') hide('hidden');
    else if (kind === 'visible') { hide('visible'); delete doc.visibilityState; } // stubbed, so a hidden pane still works
  };
  function hide(state) {
    Object.defineProperty(doc, 'visibilityState', { configurable: true, get: () => state });
    doc.dispatchEvent(new win.Event('visibilitychange'));
  }
  const q = (sel) => doc.querySelector(sel);
  const rowSel = (scope, extra = '') => `${scope} .row${extra}[data-id="${id}"]`;
  const emptyLine = () => q('.today .empty')?.textContent ?? null;
  const dueIs = (value) => async () => (await adapter.load()).todos.find((x) => x.id === id)?.due === value;
  // Checks the todo off by tapping its row in the list; waits for the save and the struck row.
  async function checkOff(what) {
    q(`${rowSel('.today', ':not(.done)')} .task`).click();
    await until(dueIs(next), `${what}: the check-off to save`);
    return until(() => q(rowSel('.today', '.done')), `${what}: the struck row`);
  }
  async function openCompleted() {
    q('.completed details').open = true;
    await wait(100); // the toggle event is async
  }
  async function undoFromCompleted(what) {
    await openCompleted();
    const btn = q(`${rowSel('.completed')} .task`);
    btn.focus();
    btn.click();
    await until(dueIs(due), `${what}: the undo to save`);
    return until(() => q(rowSel('.today', ':not(.done)')), `${what}: the row back in the list`);
  }

  q('.upcoming details').open = false; // each case below opens it when it needs it
  await wait(100);

  // visibilitychange puts the row away like pagehide, and coming back keeps focus on Completed.
  let struckRow = await checkOff('visibilitychange');
  if (!struckRow) return;
  check(emptyLine() === null, 'an empty line shows while a struck row is in the list');
  struckRow.querySelector('.task').focus();
  check(doc.activeElement === struckRow.querySelector('.task'), 'could not focus the struck row');
  fire('hidden');
  check(q(rowSel('.completed', '.done')), 'visibilitychange (hidden) did not put the row away');
  check(doc.activeElement === q('.completed summary'), 'focus (a): not on the Completed summary after leaving');
  check(emptyLine() === 'All done for today.', `all done line: ${emptyLine()}`);
  fire('pagehide');
  fire('visible');
  check(doc.activeElement === q('.completed summary'), 'focus (a2): lost after pagehide and coming back');
  // iOS may clear focus while backgrounded: the key saved on leaving brings it back.
  fire('hidden');
  doc.activeElement.blur();
  check(doc.activeElement === doc.body, 'blur did not clear focus');
  fire('visible');
  check(doc.activeElement === q('.completed summary'), 'focus lost across a hide with focus cleared');

  // (b) Undo the last Completed row: focus lands on its task back in the list.
  const undone1 = await undoFromCompleted('focus (b)');
  check(undone1 && doc.activeElement === undone1.querySelector('.task'), 'focus (b): not on the task back in the list');
  check(!q('.completed'), 'Completed still shown after undoing its last row');
  check(emptyLine() === null, 'All done line still shown after the undo');

  // Upcoming open, with the todo's next instance in it: focus must not land there.
  await checkOff('upcoming open');
  q('.upcoming details').open = true;
  await wait(100);
  q(rowSel('.today', '.done') + ' .task').focus();
  fire('hidden');
  check(q(rowSel('.completed', '.done')), 'upcoming open: the row was not put away');
  check(doc.activeElement === q('.completed summary'), 'upcoming open: focus is not on the Completed summary');
  check(!doc.activeElement.closest('.upcoming'), 'upcoming open: focus landed in Upcoming');
  fire('visible');
  q('.upcoming details').open = false;
  await wait(100);

  // (b) again, with a second Completed row left behind: the undone row's task has focus.
  // The second todo is added through the app's own sheet, so the open page knows about it.
  doc.dispatchEvent(new win.CustomEvent('planner:new', { detail: { title: 'Water plants' } }));
  await until(() => doc.getElementById('sheet').open, 'the new todo sheet');
  doc.getElementById('sheetDone').click();
  const other = await until(async () => (await adapter.load()).todos.find((x) => x.title === 'Water plants')?.id, 'the second todo to save');
  if (!other) return;
  await until(() => q(`.today .row[data-id="${other}"]`), 'the second todo');
  q(`.today .row[data-id="${other}"] .task`).click();
  await until(() => q(`.today .row.done[data-id="${other}"]`), 'the second todo struck');
  fire('hidden');
  fire('visible');
  const undone2 = await undoFromCompleted('focus (b) with another row left');
  check(q('.completed'), 'the other Completed row went too');
  check(undone2 && doc.activeElement === undone2.querySelector('.task'), 'focus (b), not the last row: not on the task back in the list');
  // Leaving with focus on a row inside an open Completed list: focus goes to its summary.
  await openCompleted();
  const otherDone = q(`.completed .row[data-id="${other}"] .task`);
  otherDone.focus();
  check(doc.activeElement === otherDone, 'could not focus the Completed row');
  fire('hidden');
  check(doc.activeElement === q('.completed summary'), 'leaving with focus in an open Completed list: not on the summary');
  fire('visible');

  // Undo with nothing focused: the tap stands in for focus.
  await openCompleted();
  doc.activeElement.blur();
  q(`.completed .row[data-id="${other}"] .task`).click();
  const back2 = await until(() => q(`.today .row:not(.done)[data-id="${other}"]`), 'the second todo back (nothing focused)');
  check(back2 && doc.activeElement === back2.querySelector('.task'), 'undo with nothing focused: focus is not on the task back in the list');

  // A tap on another row wins over the focused one (a click may not move focus).
  q(`${rowSel('.today', ':not(.done)')} .task`).focus();
  q(`.today .row:not(.done)[data-id="${other}"] .task`).click();
  check(doc.activeElement === q(`.today .row.done[data-id="${other}"] .task`), 'tap on another row: focus stayed on the focused row');
  await until(async () => !(await adapter.load()).todos.some((x) => x.id === other), 'the second todo to check off');

  // Leaving or coming back must not scroll the list: focus moves without scrolling.
  const scrollerOf = (node) => {
    for (let n = node; n && n !== doc.documentElement; n = n.parentElement) {
      const o = win.getComputedStyle(n).overflowY;
      if ((o === 'auto' || o === 'scroll') && n.scrollHeight > n.clientHeight) return n;
    }
    return doc.scrollingElement;
  };
  frame.style.height = '100px';
  await wait(100);
  const scroller = scrollerOf(doc.getElementById('list'));
  scroller.scrollTop = Math.floor((scroller.scrollHeight - scroller.clientHeight) / 2);
  const top = scroller.scrollTop;
  check(top > 0, 'could not scroll the list');
  q(`.today .row.done[data-id="${other}"] .task`).focus({ preventScroll: true });
  fire('hidden');
  check(q(`.completed .row[data-id="${other}"]`), 'scroll case: the row was not put away');
  check(scroller.scrollTop === top, `leaving scrolled the list: ${top} to ${scroller.scrollTop}`);
  fire('visible');
  check(scroller.scrollTop === top, `coming back scrolled the list: ${top} to ${scroller.scrollTop}`);
  frame.style.height = '700px';
  await wait(100);

  // Undo the other one too, to start the next case with only the first todo.
  await openCompleted();
  q(`.completed .row[data-id="${other}"] .task`).click();
  await until(() => q(`.today .row:not(.done)[data-id="${other}"]`), 'the second todo back');
  await adapter.commit([{ store: 'todos', type: 'delete', key: other }]); // the open page doesn't need to know

  // Tap fallback: no focus before the tap (as on iOS Safari); focus ends on the struck row.
  doc.activeElement.blur();
  check(doc.activeElement === doc.body, 'tap fallback: blur did not clear focus');
  q(`${rowSel('.today', ':not(.done)')} .task`).click();
  check(doc.activeElement === q(`${rowSel('.today', '.done')} .task`), 'tap fallback: focus is not on the struck row');
  await until(dueIs(next), 'tap fallback: the check-off to save');

  // Launch put-away: the record from before the check-off, with nothing put away, and the todo
  // already checked off in the database. The old page goes to about:blank first so its pagehide
  // can't overwrite the record.
  const record = JSON.parse(localStorage.getItem('planner:finished'));
  frame.src = 'about:blank';
  await new Promise((r) => { frame.onload = r; });
  localStorage.setItem('planner:finished', JSON.stringify({ ...record, away: [] }));
  frame.src = '../../src/index.html';
  await new Promise((r) => { frame.onload = r; });
  const win2 = frame.contentWindow;
  win2.addEventListener('error', (e) => failures.push(`page error: ${e.message}`));
  win2.addEventListener('unhandledrejection', (e) => failures.push(`unhandled rejection: ${e.reason}`));
  const logError2 = win2.console.error.bind(win2.console);
  win2.console.error = (...args) => { failures.push(`console.error: ${args.join(' ')}`); logError2(...args); };
  const doc2 = frame.contentDocument;
  const launched = await until(() => doc2.querySelector(`.completed .row.done[data-id="${id}"]`), 'the row in Completed after launch');
  check(launched, 'launch did not put the row away');
  check(doc2.querySelector('.today .empty')?.textContent === 'All done for today.', 'all done line missing after launch');
  localStorage.removeItem('planner:upcomingOpen');
}

try {
  await run();
} catch (err) {
  failures.push(`threw: ${err?.name} ${err?.message}`);
}
window.__result = failures.length ? `FAIL\n${failures.join('\n')}` : 'PASS';
document.getElementById('out').textContent = window.__result;
fetch('/__result', { method: 'POST', body: window.__result }).catch(() => {});
</script>
