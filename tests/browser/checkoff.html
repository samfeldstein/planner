<!doctype html>
<meta charset="utf-8">
<title>Check-off with options open</title>
<pre id="out">running…</pre>
<iframe id="app" style="width:400px;height:700px"></iframe>
<script type="module">
// Regression: expanding a row's options and then checking it off must still save the completion.
// Once threw in render() before the save, so a monthly todo never moved and came back every day.
import { createIdbAdapter } from '../../src/js/data/db.js';
import { todayLocal } from '../../src/js/core/date.js';

const failures = [];
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, what, ms = 8000) {
  for (let t = 0; t < ms; t += 50) {
    const v = await fn();
    if (v) return v;
    await wait(50);
  }
  failures.push(`timed out waiting for ${what}`);
  return null;
}

async function run() {
  await new Promise((res) => { const r = indexedDB.deleteDatabase('planner'); r.onsuccess = r.onerror = r.onblocked = res; });
  localStorage.removeItem('planner:finished');
  localStorage.removeItem('planner:upcomingOpen');

  const [y, m] = todayLocal().split('-').map(Number);
  const pad = (n) => String(n).padStart(2, '0');
  const due = `${y}-${pad(m)}-01`; // the 1st of this month: due today or overdue
  const next = m === 12 ? `${y + 1}-01-01` : `${y}-${pad(m + 1)}-01`;
  const stamp = new Date().toISOString();
  const id = 'checkoff-test';
  const adapter = createIdbAdapter();
  await adapter.commit([{ store: 'todos', type: 'put', value: {
    id, title: 'Pay rent', due, part: 'morning', groupId: null, priority: 1,
    recur: { freq: 'monthly', monthDay: 1 }, lastDone: null, createdAt: stamp, updatedAt: stamp,
  } }]);

  const frame = document.getElementById('app');
  frame.src = '../../src/index.html';
  await new Promise((r) => { frame.onload = r; });
  frame.contentWindow.addEventListener('error', (e) => failures.push(`page error: ${e.message}`));
  frame.contentWindow.addEventListener('unhandledrejection', (e) => failures.push(`unhandled rejection: ${e.reason}`));
  const logError = frame.contentWindow.console.error.bind(frame.contentWindow.console);
  frame.contentWindow.console.error = (...args) => { failures.push(`console.error: ${args.join(' ')}`); logError(...args); };
  const doc = frame.contentDocument;
  const row = await until(() => doc.querySelector(`.row[data-id="${id}"]`), 'the todo row');
  if (!row) return;

  if (!row.querySelector('.actions [data-act="tomorrow"]')) failures.push('the row has no actions');
  row.querySelector('.task').click();

  const saved = await until(async () => {
    const t = (await adapter.load()).todos.find((x) => x.id === id);
    return t && t.due === next ? t : null;
  }, `due to move to ${next}`);
  if (saved && !saved.lastDone) failures.push('lastDone was not set');
  if (!doc.querySelector(`.row.done[data-id="${id}"]`)) failures.push('row is not drawn as done');

  // Regression: editing the next instance from Upcoming, then undoing the check-off, keeps the
  // edit. Undo used to write back the whole pre-check-off snapshot.
  const upcoming = doc.querySelector(`.upcoming .row[data-id="${id}"] .task`);
  if (!upcoming) { failures.push('checked-off todo is not in Upcoming'); return; }
  doc.querySelector('.upcoming details').open = true;
  upcoming.click();
  const sheet = doc.getElementById('sheet');
  if (!await until(() => sheet.open, 'the edit sheet')) return;
  doc.getElementById('todoText').textContent = 'Pay the rent';
  doc.getElementById('priority').click(); // top priority off
  doc.getElementById('sheetDone').click();
  await until(async () => (await adapter.load()).todos.find((x) => x.id === id)?.title === 'Pay the rent', 'the edit to save');
  const struck = await until(() => doc.querySelector(`.row.done[data-id="${id}"]`), 'the struck row');
  if (!struck?.closest('section.today') || struck.classList.contains('top')) failures.push('struck row did not follow the priority edit');
  if (struck && !struck.textContent.includes('Pay the rent')) failures.push('struck row shows the old title');
  struck?.querySelector('.task').click();
  const undone = await until(async () => {
    const t = (await adapter.load()).todos.find((x) => x.id === id);
    return t && t.due === due ? t : null;
  }, `undo to move due back to ${due}`);
  if (undone && (undone.title !== 'Pay the rent' || undone.priority !== 0)) {
    failures.push(`undo lost the edit: ${undone.title}, priority ${undone.priority}`);
  }


  // Leaving the app puts checked-off todos away: they leave the list for good (there's no Completed
  // list), and the header still counts them as done.
  const win = frame.contentWindow;
  const check = (ok, what) => { if (!ok) failures.push(what); };
  const q = (sel) => doc.querySelector(sel);
  const again = await until(() => q(`.today .row:not(.done)[data-id="${id}"] .task`), 'the undone row');
  if (!again) return;
  again.click();
  await until(async () => (await adapter.load()).todos.find((x) => x.id === id)?.due === next, 'the second check-off to save');
  check(q(`.today .row.done[data-id="${id}"]`), 'the checked-off row is not struck in the list before leaving');
  win.dispatchEvent(new win.PageTransitionEvent('pagehide'));
  check(!q(`#list .row[data-id="${id}"]:not(.upcoming .row)`), 'put-away todo still drawn outside Upcoming');
  check(!q('.completed'), 'a Completed section is drawn');
  check(q('.today').nextElementSibling === q('.upcoming'), 'Upcoming is not right below the list');
  check(doc.getElementById('count').textContent === '1 of 1', `header count after leaving: ${doc.getElementById('count').textContent}`);
  const saved2 = JSON.parse(localStorage.getItem('planner:finished'));
  check(saved2?.away?.includes(id), 'put-away set was not saved');

  // Hiding the page (visibilitychange), focus when a focused struck row is put away, the tap fallback,
  // "All done for today.", and the launch put-away. Each case uses fresh todos, added through the app's
  // own sheet so the open page knows about them (one-off todos: a check-off deletes them).
  const fire = (kind) => {
    if (kind === 'pagehide') win.dispatchEvent(new win.PageTransitionEvent('pagehide'));
    else if (kind === 'hidden') hide('hidden');
    else if (kind === 'visible') { hide('visible'); delete doc.visibilityState; } // stubbed, so a hidden pane still works
  };
  function hide(state) {
    Object.defineProperty(doc, 'visibilityState', { configurable: true, get: () => state });
    doc.dispatchEvent(new win.Event('visibilitychange'));
  }
  const emptyLine = () => q('.today .empty')?.textContent ?? null;
  const exists = (tid) => async () => (await adapter.load()).todos.some((x) => x.id === tid);
  const live = (tid) => q(`.today .row:not(.done)[data-id="${tid}"]`);
  const doneRow = (tid) => q(`.today .row.done[data-id="${tid}"]`);
  async function add(title) {
    doc.dispatchEvent(new win.CustomEvent('planner:new', { detail: { title } }));
    await until(() => doc.getElementById('sheet').open, `the sheet for ${title}`);
    doc.getElementById('sheetDone').click();
    const tid = await until(async () => (await adapter.load()).todos.find((x) => x.title === title)?.id, `${title} to save`);
    await until(() => live(tid), `${title} in the list`);
    await until(() => !doc.getElementById('sheet').open, `the sheet for ${title} to close`);
    return tid;
  }
  async function checkOff(tid, what) {
    live(tid).querySelector('.task').click();
    await until(async () => !(await exists(tid)()), `${what}: the check-off to save`);
    return until(() => doneRow(tid), `${what}: the struck row`);
  }
  const focusedOn = (tid) => doc.activeElement === live(tid)?.querySelector('.task');

  q('.upcoming details').open = false; // each case below opens it when it needs it
  await wait(100);

  // Several struck rows above the focused one leave together: focus goes to the next unstruck row (D),
  // not to whatever row now sits at its old position.
  const [a, b, c, d] = [await add('Alpha'), await add('Bravo'), await add('Charlie'), await add('Delta')];
  if (!a || !b || !c || !d) return;
  for (const [tid, name] of [[a, 'Alpha'], [b, 'Bravo'], [c, 'Charlie']]) await checkOff(tid, name);
  check(emptyLine() === null, 'an empty line shows with rows in the list');
  doneRow(c).querySelector('.task').focus();
  check(doc.activeElement === doneRow(c)?.querySelector('.task'), 'could not focus the struck row');
  fire('hidden');
  check(![a, b, c].some((tid) => q(`.today .row[data-id="${tid}"]`)), 'visibilitychange (hidden) did not put the rows away');
  check(focusedOn(d), `leaving: focus is not on the next unstruck row (${doc.activeElement?.textContent})`);
  check(doc.getElementById('count').textContent === '4 of 5', `header count: ${doc.getElementById('count').textContent}`);
  fire('pagehide');
  fire('visible');
  check(focusedOn(d), 'focus lost after pagehide and coming back');
  // iOS may clear focus while backgrounded: the key saved on leaving brings it back.
  fire('hidden');
  doc.activeElement.blur();
  check(doc.activeElement === doc.body, 'blur did not clear focus');
  fire('visible');
  check(focusedOn(d), 'focus lost across a hide with focus cleared');

  // No unstruck row after it: the one before it.
  const e = await add('Echo');
  if (!e) return;
  await checkOff(e, 'Echo');
  doneRow(e).querySelector('.task').focus();
  fire('hidden');
  check(focusedOn(d), 'leaving from the last row: focus is not on the row before it');
  fire('visible');

  // The only row: the Upcoming summary, and "All done for today." With Upcoming open, the rent's next
  // instance shares its id there, and focus must not land in it.
  q('.upcoming details').open = true;
  await wait(100);
  await checkOff(d, 'Delta');
  doneRow(d).querySelector('.task').focus();
  fire('hidden');
  check(doc.activeElement === q('.upcoming summary'), `leaving from the only row: focus is not on Upcoming (${doc.activeElement?.tagName})`);
  check(emptyLine() === 'All done for today.', `all done line: ${emptyLine()}`);
  fire('visible');
  check(doc.activeElement === q('.upcoming summary'), 'coming back: focus left the Upcoming summary');
  q('.upcoming details').open = false;
  await wait(100);

  // Tap fallback: no focus before the tap (as on iOS Safari); focus ends on the struck row. Undo with
  // nothing focused: the tap stands in again, and focus is on the row back in the list.
  const f = await add('Foxtrot');
  const g = await add('Golf');
  if (!f || !g) return;
  doc.activeElement.blur();
  check(doc.activeElement === doc.body, 'tap fallback: blur did not clear focus');
  live(f).querySelector('.task').click();
  check(doc.activeElement === doneRow(f)?.querySelector('.task'), 'tap fallback: focus is not on the struck row');
  await until(async () => !(await exists(f)()), 'tap fallback: the check-off to save');
  doc.activeElement.blur();
  doneRow(f).querySelector('.task').click();
  await until(exists(f), 'undo with nothing focused: the undo to save');
  const back = await until(() => live(f), 'the row back in the list');
  check(back && focusedOn(f), 'undo with nothing focused: focus is not on the row back in the list');

  // A tap on another row wins over the focused one (a click may not move focus).
  live(f).querySelector('.task').focus();
  live(g).querySelector('.task').click();
  check(doc.activeElement === doneRow(g)?.querySelector('.task'), 'tap on another row: focus stayed on the focused row');
  await until(async () => !(await exists(g)()), 'Golf to check off');

  // Coming back uses the focus saved on leaving, not a recent tap. Undo Golf (a tap on a row that stays),
  // then leave with focus on Foxtrot.
  doneRow(g).querySelector('.task').click();
  const tappedAt = win.performance.now();
  await until(exists(g), 'Golf undone');
  await until(() => live(g), 'Golf back');
  live(f).querySelector('.task').focus();
  fire('hidden');
  check(win.performance.now() - tappedAt < 1800, 'test arrangement: the last tap is too old to matter');
  fire('visible');
  check(focusedOn(f), 'coming back used the last tap instead of the saved focus');

  // Leaving or coming back must not scroll the list, though focus moves from the struck row to the one after
  // it, which is out of view.
  const scrollerOf = (node) => {
    for (let n = node; n && n !== doc.documentElement; n = n.parentElement) {
      const o = win.getComputedStyle(n).overflowY;
      if ((o === 'auto' || o === 'scroll') && n.scrollHeight > n.clientHeight) return n;
    }
    return doc.scrollingElement;
  };
  await checkOff(f, 'scroll case');
  frame.style.height = '100px';
  await wait(100);
  const scroller = scrollerOf(doc.getElementById('list'));
  scroller.scrollTop = 0;
  doneRow(f).querySelector('.task').focus({ preventScroll: true });
  check(scroller.scrollTop === 0, 'test arrangement: focusing the struck row scrolled');
  fire('hidden');
  check(focusedOn(g), 'scroll case: focus is not on the next row');
  const view = scroller === doc.scrollingElement ? { bottom: win.innerHeight } : scroller.getBoundingClientRect();
  check(live(g).getBoundingClientRect().top >= view.bottom, 'test arrangement: the next row is in view');
  check(scroller.scrollTop === 0, `leaving scrolled the list to ${scroller.scrollTop}`);
  fire('visible');
  check(scroller.scrollTop === 0, `coming back scrolled the list to ${scroller.scrollTop}`);
  frame.style.height = '700px';
  await wait(100);

  // Launch put-away: a record with nothing put away and Golf struck in place, as if iOS killed the app
  // without a hide event. The old page goes to about:blank first so its pagehide can't overwrite the record.
  await checkOff(g, 'launch case');
  const record = JSON.parse(localStorage.getItem('planner:finished'));
  frame.src = 'about:blank';
  await new Promise((r) => { frame.onload = r; });
  localStorage.setItem('planner:finished', JSON.stringify({ ...record, away: [] }));
  frame.src = '../../src/index.html';
  await new Promise((r) => { frame.onload = r; });
  const win2 = frame.contentWindow;
  win2.addEventListener('error', (e) => failures.push(`page error: ${e.message}`));
  win2.addEventListener('unhandledrejection', (e) => failures.push(`unhandled rejection: ${e.reason}`));
  const logError2 = win2.console.error.bind(win2.console);
  win2.console.error = (...args) => { failures.push(`console.error: ${args.join(' ')}`); logError2(...args); };
  const doc2 = frame.contentDocument;
  const empty2 = await until(() => doc2.querySelector('.today .empty'), 'the list after launch');
  check(empty2?.textContent === 'All done for today.', `after launch: ${empty2?.textContent}`);
  check(!doc2.querySelector('.today .row'), 'launch did not put the rows away');
  const n = record.todos.length;
  check(doc2.getElementById('count').textContent === `${n} of ${n}`, `header count after launch: ${doc2.getElementById('count').textContent} (want ${n} of ${n})`);
  localStorage.removeItem('planner:upcomingOpen');
}

try {
  await run();
} catch (err) {
  failures.push(`threw: ${err?.name} ${err?.message}`);
}
window.__result = failures.length ? `FAIL\n${failures.join('\n')}` : 'PASS';
document.getElementById('out').textContent = window.__result;
fetch('/__result', { method: 'POST', body: window.__result }).catch(() => {});
</script>
