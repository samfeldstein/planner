<!doctype html>
<meta charset="utf-8">
<title>Swipe right for Options</title>
<pre id="out">running…</pre>
<iframe id="app" style="width:400px;height:700px"></iframe>
<script type="module">
// A swipe right on a todo shows its Options button (ui/row-swipe.js). Synthetic touch pointers; the test
// sends the click a real tap would. Transitions are off in the frame so transforms read at rest.
import { createIdbAdapter } from '../../src/js/data/db.js';
import { addDays, todayLocal } from '../../src/js/core/date.js';

const failures = [];
const skipped = [];
const check = (ok, what) => { if (!ok) failures.push(what); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, what, ms = 8000) {
  for (let t = 0; t < ms; t += 50) {
    const v = await fn();
    if (v) return v;
    await wait(50);
  }
  failures.push(`timed out waiting for ${what}`);
  return null;
}

async function run() {
  await new Promise((res) => { const r = indexedDB.deleteDatabase('planner'); r.onsuccess = r.onerror = r.onblocked = res; });
  localStorage.removeItem('planner:finished');
  localStorage.removeItem('planner:upcomingOpen');

  const today = todayLocal();
  const stamp = new Date().toISOString();
  const adapter = createIdbAdapter();
  const todo = (id, title, recur = null, due = today) => ({ store: 'todos', type: 'put', value: {
    id, title, due, part: 'morning', groupId: null, priority: 0, recur, lastDone: null, createdAt: stamp, updatedAt: stamp,
  } });
  await adapter.commit([
    todo('a', 'Stretch', { freq: 'daily' }),
    todo('b', 'Call the bank'),
    todo('c', 'Buy stamps'),
    todo('d', 'Renew passport', null, addDays(today, 3)),
  ]);

  const frame = document.getElementById('app');
  frame.src = '../../src/index.html';
  await new Promise((r) => { frame.onload = r; });
  const win = frame.contentWindow;
  win.addEventListener('error', (e) => failures.push(`page error: ${e.message}`));
  win.addEventListener('unhandledrejection', (e) => failures.push(`unhandled rejection: ${e.reason}`));
  const logError = win.console.error.bind(win.console);
  win.console.error = (...args) => { failures.push(`console.error: ${args.join(' ')}`); logError(...args); };
  const doc = frame.contentDocument;
  const style = doc.createElement('style');
  style.textContent = '* { transition: none !important; }';
  doc.head.append(style);

  const row = (id) => doc.querySelector(`.today .row[data-id="${id}"]`);
  if (!await until(() => row('a') && row('b') && row('c'), 'the three rows')) return;
  const task = (id) => row(id).querySelector('.task');
  const more = (id) => row(id).querySelector('.row-more');
  const shiftX = (node) => new win.DOMMatrix(win.getComputedStyle(node).transform).m41;
  const width = more('a').getBoundingClientRect().width;
  check(width >= 80, `Options button width ${width}`);
  check(more('a').textContent === 'Options', 'Options button has no visible label');
  check(more('a').getBoundingClientRect().right <= 0.5, 'Options button shows before a swipe');
  check(shiftX(task('a')) === 0, 'the task is shifted before a swipe');

  let pid = 10;
  const ptr = (node, type, x, y, extra = {}) => node.dispatchEvent(new win.PointerEvent(type, {
    bubbles: true, cancelable: true, composed: true, isPrimary: true, pointerType: 'touch', button: type === 'pointermove' ? -1 : 0,
    clientX: x, clientY: y, ...extra,
  }));
  // A drag on a node: down, a few moves, then up (or the given end event).
  function drag(node, dx, dy, { end = 'pointerup', type = 'touch' } = {}) {
    const id = ++pid;
    const r = node.getBoundingClientRect();
    const x = r.left + 60, y = r.top + r.height / 2;
    ptr(node, 'pointerdown', x, y, { pointerId: id, pointerType: type });
    for (let i = 1; i <= 4; i++) ptr(node, 'pointermove', x + (dx * i) / 4, y + (dy * i) / 4, { pointerId: id, pointerType: type });
    if (end) ptr(node, end, x + dx, y + dy, { pointerId: id, pointerType: type });
    return { id, x: x + dx, y: y + dy };
  }
  // A still tap, with the click a real one sends.
  function tap(node) {
    const id = ++pid;
    const r = node.getBoundingClientRect();
    const x = r.left + Math.min(60, r.width / 2), y = r.top + r.height / 2;
    ptr(node, 'pointerdown', x, y, { pointerId: id });
    ptr(node, 'pointerup', x, y, { pointerId: id });
    node.click();
  }
  const done = async (id) => (await adapter.load()).todos.find((t) => t.id === id)?.lastDone !== null;

  // A swipe past half opens; the click that may follow doesn't complete.
  drag(task('a'), 60, 2);
  check(row('a').classList.contains('swiped'), 'swipe past half did not open');
  check(!row('a').classList.contains('dragging') && !row('a').style.getPropertyValue('--swipe'), 'drag state left after a swipe');
  check(Math.abs(shiftX(task('a')) - width) < 1, `open row's task shifted ${shiftX(task('a'))}, not ${width}`);
  check(Math.abs(shiftX(more('a'))) < 1, 'Options button not in view on an open row');
  task('a').click();
  await wait(150);
  check(!row('a').classList.contains('done') && !await done('a'), 'the click after a swipe completed the todo');

  // Tapping Options opens the menu and closes the swipe.
  tap(more('a'));
  check(!row('a').querySelector('.actions').hidden, 'Options did not open the menu');
  check(row('a').querySelector('[data-act="skip"]'), 'menu has no Skip on a repeating todo');
  check(!row('a').classList.contains('swiped'), 'the swipe stayed open after tapping Options');
  check(more('a').getAttribute('aria-expanded') === 'true', 'aria-expanded not true');
  more('a').click();
  check(row('a').querySelector('.actions').hidden, 'Options did not close the menu');

  // A short drag snaps back; so does a vertical one.
  drag(task('b'), 30, 0);
  check(!row('b').classList.contains('swiped'), 'a short drag opened');
  drag(task('b'), 4, 40);
  check(!row('b').classList.contains('swiped') && !row('b').classList.contains('dragging'), 'a vertical drag opened');

  // A tap on the open row's task closes it without completing.
  drag(task('b'), 70, 0);
  await wait(600); // past the grace for a drag's click
  check(row('b').classList.contains('swiped'), 'second swipe did not open');
  tap(task('b'));
  await wait(150);
  check(!row('b').classList.contains('swiped'), 'tap on the open row did not close it');
  check(!row('b').classList.contains('done') && !await done('b'), 'tap on the open row completed it');

  // With a row open, a tap on another row closes the first and doesn't complete the second.
  drag(task('b'), 70, 0);
  await wait(600);
  tap(task('c'));
  await wait(150);
  check(!row('b').classList.contains('swiped'), 'tap elsewhere did not close the open row');
  check(!row('c').classList.contains('done') && !await done('c'), 'the dismiss tap completed another todo');

  // A slow dismiss tap: the grace starts when the finger lifts.
  drag(task('b'), 70, 0);
  await wait(600);
  {
    const id = ++pid;
    const r = task('c').getBoundingClientRect();
    ptr(task('c'), 'pointerdown', r.left + 60, r.top + 10, { pointerId: id });
    await wait(700);
    ptr(task('c'), 'pointerup', r.left + 60, r.top + 10, { pointerId: id });
    task('c').click();
    await wait(150);
    check(!row('c').classList.contains('done') && !await done('c'), 'a slow dismiss tap completed another todo');
  }

  // pointercancel mid-drag resets.
  drag(task('b'), 50, 0, { end: 'pointercancel' });
  check(!row('b').classList.contains('dragging') && !row('b').style.getPropertyValue('--swipe') && !row('b').classList.contains('swiped'), 'pointercancel left drag state');

  // A re-render mid-drag leaves no drag state on the new row.
  {
    const old = row('b');
    const { id, x, y } = drag(task('b'), 50, 0, { end: null });
    check(old.classList.contains('dragging'), 'mid-drag row is not dragging');
    Object.defineProperty(doc, 'visibilityState', { configurable: true, get: () => 'visible' });
    doc.dispatchEvent(new win.Event('visibilitychange'));
    delete doc.visibilityState;
    check(row('b') !== old, 'test arrangement: the row was not redrawn');
    ptr(doc, 'pointermove', x + 20, y, { pointerId: id });
    ptr(doc, 'pointerup', x + 20, y, { pointerId: id });
    check(!row('b').classList.contains('dragging') && !row('b').classList.contains('swiped') && !row('b').style.getPropertyValue('--swipe'), 'drag state on the redrawn row');
  }

  // A mouse drag does nothing; right-click still opens the menu.
  drag(task('b'), 70, 0, { type: 'mouse' });
  check(!row('b').classList.contains('swiped'), 'a mouse drag opened the row');
  task('b').dispatchEvent(new win.MouseEvent('contextmenu', { bubbles: true, cancelable: true, button: 2 }));
  check(!row('b').querySelector('.actions').hidden, 'right-click did not open the menu');
  task('b').dispatchEvent(new win.MouseEvent('contextmenu', { bubbles: true, cancelable: true, button: 2 }));

  // The button is as tall as the task and stays clear of the menu below it.
  more('a').click();
  {
    const actions = row('a').querySelector('.actions');
    check(!actions.hidden, 'Options did not open the menu (layout check)');
    check(Math.abs(more('a').getBoundingClientRect().height - task('a').getBoundingClientRect().height) < 1, 'Options button is not as tall as the task');
    check(more('a').getBoundingClientRect().bottom <= actions.getBoundingClientRect().top + 0.5, 'Options button overlaps the menu');
    more('a').click();
  }

  // Keyboard focus on Options slides the row open. Only where the page has focus (headless Chrome does;
  // the Claude browser pane may not, and then nothing can match :focus).
  if (!doc.hasFocus()) skipped.push('keyboard focus (the page has no focus)');
  else {
    more('a').focus({ focusVisible: true });
    if (!more('a').matches(':focus-visible')) failures.push('test setup: Options focus is not :focus-visible');
    else {
      check(Math.abs(shiftX(task('a')) - width) < 1, 'keyboard focus on Options did not slide the row open');
      check(Math.abs(shiftX(more('a'))) < 1, 'keyboard focus on Options did not show it');
      more('a').blur();
      check(shiftX(task('a')) === 0, 'the row stayed open after focus left Options');
    }
  }

  // A dismiss tap on + is swallowed too: the sheet doesn't open.
  drag(task('b'), 70, 0);
  await wait(600);
  tap(doc.getElementById('addBtn'));
  await wait(150);
  check(!row('b').classList.contains('swiped'), 'tap on + did not close the open row');
  check(!doc.getElementById('sheet').open, 'the dismiss tap on + opened the sheet');

  // A dismiss tap that turns into a scroll (pointercancel) leaves no swallow behind.
  drag(task('b'), 70, 0);
  await wait(600);
  {
    const id = ++pid;
    const r = task('c').getBoundingClientRect();
    ptr(task('c'), 'pointerdown', r.left + 60, r.top + 10, { pointerId: id });
    ptr(task('c'), 'pointercancel', r.left + 60, r.top + 40, { pointerId: id });
    let reached = false;
    const probe = () => { reached = true; };
    doc.addEventListener('click', probe);
    doc.body.click();
    doc.removeEventListener('click', probe);
    check(reached, 'a click after a cancelled dismiss tap was swallowed');
  }

  // Upcoming and struck rows don't swipe.
  doc.querySelector('.upcoming details').open = true;
  await wait(100);
  const upRow = doc.querySelector('.upcoming .row[data-id="d"]');
  check(upRow, 'test arrangement: no Upcoming row');
  if (upRow) {
    drag(upRow.querySelector('.task'), 70, 0);
    check(!upRow.classList.contains('swiped') && !upRow.classList.contains('dragging'), 'an Upcoming row swiped');
  }
  doc.querySelector('.upcoming details').open = false;

  // A row slid open by keyboard focus is open too: a tap on its task only closes it.
  if (doc.hasFocus()) {
    more('b').focus({ focusVisible: true });
    if (more('b').matches(':focus-visible')) {
      tap(task('b'));
      await wait(150);
      check(!row('b').classList.contains('done') && !await done('b'), 'a tap on a keyboard-opened row completed it');
      check(shiftX(task('b')) === 0, 'a tap on a keyboard-opened row did not close it');
    }
  }

  // With a row's menu open and the row swiped, a tap on a menu item still gets through. (The probe stops
  // the click there, so nothing is moved to tomorrow.)
  more('b').click();
  drag(task('b'), 70, 0);
  await wait(600);
  {
    const item = row('b').querySelector('[data-act="tomorrow"]');
    let reached = false;
    const probe = (e) => { reached = true; e.stopPropagation(); };
    item.addEventListener('click', probe);
    tap(item);
    item.removeEventListener('click', probe);
    check(reached, 'a tap on the open row\'s menu was swallowed');
    if (row('b').classList.contains('swiped')) more('b').click(); // closes the swipe
    if (!row('b').querySelector('.actions').hidden) more('b').click();
  }

  // The grace clears: after a short drag, the next tap completes.
  drag(task('c'), 30, 0);
  tap(task('c'));
  check(await until(() => done('c'), 'the tap after a short drag to complete'), 'the next real tap was eaten');
  const struck = await until(() => doc.querySelector('.today .row.done[data-id="c"]'), 'the struck row');
  if (struck) {
    drag(struck.querySelector('.task'), 70, 0);
    check(!struck.classList.contains('swiped') && !struck.classList.contains('dragging'), 'a struck row swiped');
  }
}

try {
  await run();
} catch (err) {
  failures.push(`threw: ${err?.name} ${err?.message}`);
}
window.__result = failures.length ? `FAIL\n${failures.join('\n')}` : `PASS${skipped.length ? ` (skipped: ${skipped.join('; ')})` : ''}`;
document.getElementById('out').textContent = window.__result;
fetch('/__result', { method: 'POST', body: window.__result }).catch(() => {});
</script>
