<!doctype html>
<meta charset="utf-8">
<title>Swipe right for the row actions</title>
<pre id="out">running…</pre>
<iframe id="app" style="width:400px;height:700px"></iframe>
<script type="module">
// A swipe right on a todo shows its actions in the row (ui/row-swipe.js). Synthetic touch pointers; the test
// sends the click a real tap would. Transitions are off in the frame so transforms read at rest.
import { createIdbAdapter } from '../../src/js/data/db.js';
import { addDays, todayLocal } from '../../src/js/core/date.js';

const failures = [];
const skipped = [];
const check = (ok, what) => { if (!ok) failures.push(what); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, what, ms = 8000) {
  for (let t = 0; t < ms; t += 50) {
    const v = await fn();
    if (v) return v;
    await wait(50);
  }
  failures.push(`timed out waiting for ${what}`);
  return null;
}

async function run() {
  await new Promise((res) => { const r = indexedDB.deleteDatabase('planner'); r.onsuccess = r.onerror = r.onblocked = res; });
  localStorage.removeItem('planner:finished');
  localStorage.removeItem('planner:upcomingOpen');

  const today = todayLocal();
  const stamp = new Date().toISOString();
  const adapter = createIdbAdapter();
  const todo = (id, title, recur = null, due = today) => ({ store: 'todos', type: 'put', value: {
    id, title, due, part: 'morning', groupId: null, priority: 0, recur, lastDone: null, createdAt: stamp, updatedAt: stamp,
  } });
  await adapter.commit([
    todo('a', 'Stretch', { freq: 'daily' }),
    todo('b', 'Call the bank'),
    todo('c', 'Buy stamps'),
    todo('d', 'Renew passport', null, addDays(today, 3)),
  ]);

  const frame = document.getElementById('app');
  frame.src = '../../src/index.html';
  await new Promise((r) => { frame.onload = r; });
  const win = frame.contentWindow;
  win.addEventListener('error', (e) => failures.push(`page error: ${e.message}`));
  win.addEventListener('unhandledrejection', (e) => failures.push(`unhandled rejection: ${e.reason}`));
  const logError = win.console.error.bind(win.console);
  win.console.error = (...args) => { failures.push(`console.error: ${args.join(' ')}`); logError(...args); };
  const doc = frame.contentDocument;
  const style = doc.createElement('style');
  style.textContent = '* { transition: none !important; }';
  doc.head.append(style);

  const row = (id) => doc.querySelector(`.today .row[data-id="${id}"]`);
  if (!await until(() => row('a') && row('b') && row('c'), 'the three rows')) return;
  const task = (id) => row(id).querySelector('.task');
  const strip = (id) => row(id).querySelector('.actions');
  const action = (id, act) => row(id).querySelector(`.actions [data-act="${act}"]`);
  const shiftX = (node) => new win.DOMMatrix(win.getComputedStyle(node).transform).m41;
  const height = (node) => node.getBoundingClientRect().height;
  const isOpen = (id) => Math.abs(shiftX(strip(id))) < 1 && shiftX(task(id)) > 1;
  const width = strip('a').getBoundingClientRect().width;

  // The strip: Tomorrow, Skip, and Edit on a repeating todo, no Skip otherwise; labeled with the todo; each
  // label fits; off-screen, and the row no taller than its task.
  check([...strip('a').children].map((b) => b.dataset.act).join() === 'tomorrow,skip,edit', 'a repeating todo lacks Tomorrow, Skip, and Edit');
  check([...strip('b').children].map((b) => b.dataset.act).join() === 'tomorrow,edit', 'a one-off todo has Skip or lacks an action');
  check(action('a', 'tomorrow').getAttribute('aria-label') === 'Tomorrow: Stretch', 'actions are not labeled with the todo');
  check(width >= 240, `three-action strip width ${width}`);
  for (const b of strip('a').children) check(b.scrollWidth <= b.clientWidth, `"${b.textContent}" doesn't fit its button`);
  check(strip('a').getBoundingClientRect().right <= 0.5, 'the strip shows before a swipe');
  check(shiftX(task('a')) === 0, 'the task is shifted before a swipe');
  check(Math.abs(height(row('a')) - height(task('a'))) < 1, 'a closed row is taller than its task');
  check(Math.abs(height(strip('a')) - height(task('a'))) < 1, 'the strip is not as tall as the task');
  check(win.getComputedStyle(row('a')).touchAction === 'pan-y pinch-zoom', `today row touch-action is ${win.getComputedStyle(row('a')).touchAction}`);

  let pid = 10;
  const ptr = (node, type, x, y, extra = {}) => node.dispatchEvent(new win.PointerEvent(type, {
    bubbles: true, cancelable: true, composed: true, isPrimary: true, pointerType: 'touch', button: type === 'pointermove' ? -1 : 0,
    clientX: x, clientY: y, ...extra,
  }));
  // A drag on a node: down, a few moves, then up (or the given end event).
  function drag(node, dx, dy, { end = 'pointerup', type = 'touch' } = {}) {
    const id = ++pid;
    const r = node.getBoundingClientRect();
    const x = r.left + 60, y = r.top + r.height / 2;
    ptr(node, 'pointerdown', x, y, { pointerId: id, pointerType: type });
    for (let i = 1; i <= 4; i++) ptr(node, 'pointermove', x + (dx * i) / 4, y + (dy * i) / 4, { pointerId: id, pointerType: type });
    if (end) ptr(node, end, x + dx, y + dy, { pointerId: id, pointerType: type });
    return { id, x: x + dx, y: y + dy };
  }
  // A still tap, with the click a real one sends.
  function tap(node) {
    const id = ++pid;
    const r = node.getBoundingClientRect();
    const x = r.left + Math.min(60, r.width / 2), y = r.top + r.height / 2;
    ptr(node, 'pointerdown', x, y, { pointerId: id });
    ptr(node, 'pointerup', x, y, { pointerId: id });
    node.click();
  }
  const done = async (id) => (await adapter.load()).todos.find((t) => t.id === id)?.lastDone !== null;
  const open = async (id) => { drag(task(id), 160, 0); await wait(600); }; // past the grace for a drag's click
  const sheetEl = doc.getElementById('sheet');

  // A swipe past half opens, in place: the row keeps its height and the row below stays put. The click that
  // may follow doesn't complete.
  {
    const before = { h: height(row('a')), next: row('b').getBoundingClientRect().top };
    drag(task('a'), 160, 2);
    check(row('a').classList.contains('swiped'), 'swipe past half did not open');
    check(!row('a').classList.contains('dragging') && !row('a').style.getPropertyValue('--swipe'), 'drag state left after a swipe');
    check(Math.abs(shiftX(task('a')) - width) < 1, `open row's task shifted ${shiftX(task('a'))}, not ${width}`);
    check(Math.abs(shiftX(strip('a'))) < 1, 'the strip is not in view on an open row');
    check(Math.abs(height(row('a')) - before.h) < 1, 'opening changed the row height');
    check(Math.abs(row('b').getBoundingClientRect().top - before.next) < 1, 'opening moved the row below');
    task('a').click();
    await wait(150);
    check(!row('a').classList.contains('done') && !await done('a'), 'the click after a swipe completed the todo');
  }
  tap(task('b')); // closes a
  await wait(600);

  // A short drag snaps back; so does a vertical one.
  drag(task('b'), 50, 0);
  check(!row('b').classList.contains('swiped'), 'a short drag opened');
  drag(task('b'), 4, 40);
  check(!row('b').classList.contains('swiped') && !row('b').classList.contains('dragging'), 'a vertical drag opened');

  // A tap on the open row's task closes it without completing.
  await open('b');
  check(row('b').classList.contains('swiped'), 'second swipe did not open');
  tap(task('b'));
  await wait(150);
  check(!row('b').classList.contains('swiped'), 'tap on the open row did not close it');
  check(!row('b').classList.contains('done') && !await done('b'), 'tap on the open row completed it');

  // With a row open, a tap on another row closes the first and doesn't complete the second.
  await open('b');
  tap(task('c'));
  await wait(150);
  check(!row('b').classList.contains('swiped'), 'tap elsewhere did not close the open row');
  check(!row('c').classList.contains('done') && !await done('c'), 'the dismiss tap completed another todo');

  // A slow dismiss tap: the grace starts when the finger lifts.
  await open('b');
  {
    const id = ++pid;
    const r = task('c').getBoundingClientRect();
    ptr(task('c'), 'pointerdown', r.left + 60, r.top + 10, { pointerId: id });
    await wait(700);
    ptr(task('c'), 'pointerup', r.left + 60, r.top + 10, { pointerId: id });
    task('c').click();
    await wait(150);
    check(!row('c').classList.contains('done') && !await done('c'), 'a slow dismiss tap completed another todo');
  }

  // pointercancel mid-drag resets.
  drag(task('b'), 50, 0, { end: 'pointercancel' });
  check(!row('b').classList.contains('dragging') && !row('b').style.getPropertyValue('--swipe') && !row('b').classList.contains('swiped'), 'pointercancel left drag state');

  // A re-render mid-drag leaves no drag state on the new row.
  {
    const old = row('b');
    const { id, x, y } = drag(task('b'), 50, 0, { end: null });
    check(old.classList.contains('dragging'), 'mid-drag row is not dragging');
    Object.defineProperty(doc, 'visibilityState', { configurable: true, get: () => 'visible' });
    doc.dispatchEvent(new win.Event('visibilitychange'));
    delete doc.visibilityState;
    check(row('b') !== old, 'test arrangement: the row was not redrawn');
    ptr(doc, 'pointermove', x + 20, y, { pointerId: id });
    ptr(doc, 'pointerup', x + 20, y, { pointerId: id });
    check(!row('b').classList.contains('dragging') && !row('b').classList.contains('swiped') && !row('b').style.getPropertyValue('--swipe'), 'drag state on the redrawn row');
  }

  // A mouse drag does nothing; right-click opens the row, and a right-click on another row moves it there.
  drag(task('b'), 160, 0, { type: 'mouse' });
  check(!row('b').classList.contains('swiped'), 'a mouse drag opened the row');
  const rightClick = (node) => node.dispatchEvent(new win.MouseEvent('contextmenu', { bubbles: true, cancelable: true, button: 2 }));
  rightClick(task('b'));
  check(row('b').classList.contains('swiped'), 'right-click did not open the row');
  rightClick(task('c'));
  check(row('c').classList.contains('swiped') && !row('b').classList.contains('swiped'), 'right-click on another row did not move the open row');
  row('c').classList.remove('swiped');

  // Keyboard focus on an action slides the row open. Only where the page has focus (headless Chrome does;
  // the Claude browser pane may not, and then nothing can match :focus).
  if (!doc.hasFocus()) win.focus();
  if (!doc.hasFocus()) skipped.push('keyboard focus (the page has no focus)');
  else {
    action('a', 'tomorrow').focus({ focusVisible: true });
    if (!action('a', 'tomorrow').matches(':focus-visible')) failures.push('test setup: action focus is not :focus-visible');
    else {
      check(isOpen('a'), 'keyboard focus on an action did not slide the row open');
      action('a', 'tomorrow').blur();
      check(shiftX(task('a')) === 0, 'the row stayed open after focus left its actions');
    }
  }

  // A dismiss tap on + is swallowed too: the sheet doesn't open.
  await open('b');
  check(row('b').classList.contains('swiped'), 'test setup: row not swiped before the tap on +');
  tap(doc.getElementById('addBtn'));
  await wait(150);
  check(!row('b').classList.contains('swiped'), 'tap on + did not close the open row');
  check(!sheetEl.open, 'the dismiss tap on + opened the sheet');

  // A dismiss tap that turns into a scroll (pointercancel) leaves no swallow behind.
  await open('b');
  {
    const id = ++pid;
    const r = task('c').getBoundingClientRect();
    ptr(task('c'), 'pointerdown', r.left + 60, r.top + 10, { pointerId: id });
    ptr(task('c'), 'pointercancel', r.left + 60, r.top + 40, { pointerId: id });
    let reached = false;
    const probe = () => { reached = true; };
    doc.addEventListener('click', probe);
    doc.body.click();
    doc.removeEventListener('click', probe);
    check(reached, 'a click after a cancelled dismiss tap was swallowed');
  }

  // Upcoming and struck rows don't swipe.
  doc.querySelector('.upcoming details').open = true;
  await wait(100);
  const upRow = doc.querySelector('.upcoming .row[data-id="d"]');
  check(upRow, 'test arrangement: no Upcoming row');
  if (upRow) {
    drag(upRow.querySelector('.task'), 160, 0);
    check(!upRow.classList.contains('swiped') && !upRow.classList.contains('dragging'), 'an Upcoming row swiped');
  }
  doc.querySelector('.upcoming details').open = false;

  // A row slid open by keyboard focus is open too: a tap on its task only closes it.
  if (doc.hasFocus()) {
    action('b', 'edit').focus({ focusVisible: true });
    if (action('b', 'edit').matches(':focus-visible')) {
      tap(task('b'));
      await wait(150);
      check(!row('b').classList.contains('done') && !await done('b'), 'a tap on a keyboard-opened row completed it');
      check(shiftX(task('b')) === 0, 'a tap on a keyboard-opened row did not close it');
    }
  }

  // On an open row, a tap on an action gets through and closes the row. (The probe stops the click at the
  // button, so nothing moves to tomorrow; today-view's handler is skipped, so close it here.)
  await open('b');
  {
    let reached = false;
    const probe = (e) => { reached = true; e.stopPropagation(); };
    action('b', 'tomorrow').addEventListener('click', probe);
    tap(action('b', 'tomorrow'));
    action('b', 'tomorrow').removeEventListener('click', probe);
    check(reached, "a tap on the open row's action was swallowed");
    row('b').classList.remove('swiped');
  }

  // Edit from an open row: the row closes, the sheet opens, and its first tap works. Closing leaves it closed.
  await open('b');
  tap(action('b', 'edit'));
  if (await until(() => sheetEl.open, 'the edit sheet')) {
    check(!row('b').classList.contains('swiped'), 'the row stayed open behind the edit sheet');
    let reached = false;
    const probe = (e) => { reached = true; e.stopPropagation(); e.preventDefault(); };
    sheetEl.addEventListener('click', probe, true);
    tap(doc.getElementById('sheetDone'));
    sheetEl.removeEventListener('click', probe, true);
    check(reached, 'the first tap in the edit sheet was swallowed');
    sheetEl.close();
    await wait(100);
    check(!row('b').classList.contains('swiped') && shiftX(task('b')) === 0, 'the row was open after Edit and closing the sheet');
  }

  // Edit, then save a change: the redrawn row is closed.
  await open('b');
  tap(action('b', 'edit'));
  if (await until(() => sheetEl.open, 'the edit sheet (save)')) {
    doc.getElementById('todoText').textContent = 'Call the bank today';
    doc.getElementById('sheetForm').requestSubmit();
    await until(() => !sheetEl.open && row('b')?.querySelector('.title')?.textContent.includes('today'), 'the redrawn row');
    check(!row('b').classList.contains('swiped') && shiftX(task('b')) === 0, 'the row was open after saving an edit');
  }

  // Keyboard: Edit moves focus to the todo; closing the sheet, or saving a change, puts it back there.
  if (!doc.hasFocus()) skipped.push('Edit focus (the page has no focus)');
  else {
    action('b', 'edit').focus({ focusVisible: true });
    action('b', 'edit').click();
    if (await until(() => sheetEl.open, 'the edit sheet (keyboard)')) {
      sheetEl.close();
      await until(() => doc.activeElement === task('b'), 'focus back on the todo after closing');
      check(doc.activeElement === task('b'), `focus after closing the sheet is on ${doc.activeElement?.className || doc.activeElement?.tagName}, not the todo`);
    }
    action('b', 'edit').focus({ focusVisible: true });
    action('b', 'edit').click();
    if (await until(() => sheetEl.open, 'the edit sheet (keyboard save)')) {
      doc.getElementById('todoText').textContent = 'Call the bank soon';
      doc.getElementById('sheetForm').requestSubmit();
      await until(() => !sheetEl.open && row('b')?.querySelector('.title')?.textContent.includes('soon'), 'the redrawn row (keyboard)');
      await until(() => doc.activeElement === task('b'), 'focus back on the todo after saving');
      check(doc.activeElement === task('b'), `focus after saving is on ${doc.activeElement?.className || doc.activeElement?.tagName}, not the todo`);
    }
    doc.activeElement?.blur();
  }

  // An Upcoming row still opens the edit sheet.
  doc.querySelector('.upcoming details').open = true;
  const later = await until(() => doc.querySelector('.upcoming .row[data-id="d"] .task'), 'the Upcoming row');
  if (later) {
    later.click();
    check(await until(() => sheetEl.open, 'the sheet from Upcoming'), 'an Upcoming row did not open the sheet');
    sheetEl.close();
    await wait(50);
  }
  doc.querySelector('.upcoming details').open = false;

  // A second finger lifting, or cancelled, doesn't cut short the first finger's dismiss swallow.
  for (const end of ['pointerup', 'pointercancel']) {
    await open('a');
    check(row('a').classList.contains('swiped'), `test setup: row a not open (second finger ${end})`);
    const r = task('c').getBoundingClientRect();
    const x = r.left + 60, y = r.top + r.height / 2;
    const first = ++pid, second = ++pid;
    ptr(task('c'), 'pointerdown', x, y, { pointerId: first });
    ptr(task('c'), 'pointerdown', x + 40, y, { pointerId: second, isPrimary: false });
    ptr(task('c'), end, x + 40, y, { pointerId: second, isPrimary: false });
    await wait(600);
    ptr(task('c'), 'pointerup', x, y, { pointerId: first });
    task('c').click();
    await wait(300);
    check(!await done('c'), `a second finger's ${end} let the dismiss tap complete a todo`);
    check(!row('a').classList.contains('swiped'), `the dismiss tap did not close the open row (${end})`);
  }

  // Two open rows (one by keyboard, one swiped): a tap elsewhere closes both and completes nothing; a tap on
  // one row's action closes the other.
  if (!doc.hasFocus()) skipped.push('keyboard-opened rows (the page has no focus)');
  else {
    await open('b');
    action('a', 'tomorrow').focus({ focusVisible: true });
    check(row('b').classList.contains('swiped') && isOpen('a'), 'test setup: two rows not open');
    tap(task('c'));
    await wait(150);
    check(!row('b').classList.contains('swiped') && shiftX(task('a')) === 0, 'a dismiss did not close both open rows');
    check(!row('c').classList.contains('done') && !await done('c'), 'the dismiss of two open rows completed a todo');
    await wait(600);
    await open('b');
    action('a', 'tomorrow').focus({ focusVisible: true });
    let reached = false;
    const probe = (e) => { reached = true; e.stopPropagation(); };
    action('a', 'tomorrow').addEventListener('click', probe);
    tap(action('a', 'tomorrow'));
    action('a', 'tomorrow').removeEventListener('click', probe);
    check(reached, "a tap on a keyboard-opened row's action was swallowed");
    check(!row('b').classList.contains('swiped'), "a tap on one open row's action left the other row open");
    action('a', 'tomorrow').blur();
  }

  // The grace clears: after a short drag, the next tap completes.
  await wait(600);
  drag(task('c'), 30, 0);
  tap(task('c'));
  check(await until(() => done('c'), 'the tap after a short drag to complete'), 'the next real tap was eaten');
  const struck = await until(() => doc.querySelector('.today .row.done[data-id="c"]'), 'the struck row');
  if (struck) {
    drag(struck.querySelector('.task'), 160, 0);
    check(!struck.classList.contains('swiped') && !struck.classList.contains('dragging'), 'a struck row swiped');
  }

  // A repeating todo checked off today is struck in today's list and next due in Upcoming.
  await wait(600);
  tap(task('a'));
  await until(() => doc.querySelector('.today .row.done[data-id="a"]'), 'the repeating todo struck in today');
  doc.querySelector('.upcoming details').open = true;
  // Keyboard Edit from Upcoming, then Save: focus goes back to the Upcoming row, not the same todo's row in today's list.
  const laterA = () => doc.querySelector('.upcoming .row[data-id="a"] .task');
  if (!doc.hasFocus()) skipped.push('Edit focus from Upcoming (the page has no focus)');
  else if (!await until(laterA, 'the repeating todo in Upcoming')) { /* reported by until */ }
  else {
    laterA().focus();
    laterA().click();
    if (await until(() => sheetEl.open, 'the sheet from Upcoming (keyboard save)')) {
      doc.getElementById('todoText').textContent = 'Stretch more';
      doc.getElementById('sheetForm').requestSubmit();
      await until(() => !sheetEl.open && laterA()?.textContent.includes('more'), 'the redrawn Upcoming row');
      await until(() => doc.activeElement === laterA(), 'focus back on the Upcoming row after saving');
      check(doc.activeElement === laterA(), `focus after saving from Upcoming is on ${doc.activeElement?.closest('section')?.className} ${doc.activeElement?.className}, not the Upcoming row`);
    }
    doc.activeElement?.blur();
  }

  // Keyboard Edit from Upcoming that moves the todo to today: focus follows it into today's list.
  const laterD = await until(() => doc.querySelector('.upcoming .row[data-id="d"] .task'), 'todo d in Upcoming');
  if (laterD && doc.hasFocus()) {
    laterD.focus();
    laterD.click();
    if (await until(() => sheetEl.open, 'the sheet for d')) {
      doc.querySelector('#sheetForm input[name="due"][value="today"]').click();
      doc.getElementById('sheetForm').requestSubmit();
      await until(() => !sheetEl.open && row('d'), 'd redrawn in today');
      await until(() => doc.activeElement === row('d')?.querySelector('.task'), 'focus on d in today');
      check(doc.activeElement === row('d')?.querySelector('.task'),
        `focus after moving d to today is on ${doc.activeElement?.tagName} ${doc.activeElement?.className}`);
    }
    doc.activeElement?.blur();
  }

  // More keyboard Edits that redraw the list: focus never ends on body.
  const focusName = () => `${doc.activeElement?.closest('section')?.className ?? ''} ${doc.activeElement?.tagName} ${doc.activeElement?.className}`;
  const onCheck = () => !!doc.activeElement?.matches('#list [data-act="complete"], #list [data-act="uncomplete"]');
  async function keyboardEdit(btn, what, finish) {
    btn.focus({ focusVisible: true });
    btn.click();
    if (!await until(() => sheetEl.open, `the sheet (${what})`)) return false;
    finish();
    await until(() => !sheetEl.open, `the sheet to close (${what})`);
    await wait(100); // the close event
    return true;
  }
  const moveTo = (due) => () => {
    doc.querySelector(`#sheetForm input[name="due"][value="${due}"]`).click();
    doc.getElementById('sheetForm').requestSubmit();
  };
  const remove = () => doc.getElementById('deleteBtn').click();
  if (!doc.hasFocus()) skipped.push('Edit focus after moves and deletes (the page has no focus)');
  else if (row('b') && row('d')) {
    // Today to Tomorrow with Upcoming open: focus follows the row into Upcoming.
    doc.querySelector('.upcoming details').open = true;
    if (await keyboardEdit(action('b', 'edit'), 'b to Tomorrow, Upcoming open', moveTo('tomorrow'))) {
      const laterB = doc.querySelector('.upcoming .row[data-id="b"] .task');
      check(laterB && doc.activeElement === laterB, `focus after moving b into an open Upcoming is on ${focusName()}`);
    }
    // Today to Tomorrow with Upcoming collapsed: the moved row can't take focus; a nearby check-off does.
    doc.querySelector('.upcoming details').open = false;
    await wait(50);
    if (await keyboardEdit(action('d', 'edit'), 'd to Tomorrow, Upcoming collapsed', moveTo('tomorrow'))) {
      check(onCheck(), `focus after moving d into a collapsed Upcoming is on ${focusName()}`);
    }
    // Delete from Upcoming: the Upcoming summary.
    doc.querySelector('.upcoming details').open = true;
    const laterB = await until(() => doc.querySelector('.upcoming .row[data-id="b"] .task'), 'b in Upcoming');
    if (laterB && await keyboardEdit(laterB, 'delete b from Upcoming', remove)) {
      check(doc.activeElement === doc.querySelector('.upcoming summary'), `focus after deleting from Upcoming is on ${focusName()}`);
    }
    // Delete from today: a nearby check-off. (Undo c first, so today's list has a live row.)
    await wait(600);
    tap(task('c'));
    if (await until(() => row('c') && !row('c').classList.contains('done'), 'c undone')) {
      if (await keyboardEdit(action('c', 'edit'), 'delete c from today', remove)) {
        check(!row('c') && onCheck(), `focus after deleting from today is on ${focusName()}`);
      }
    }
    doc.activeElement?.blur();
  } else failures.push('test setup: rows b and d are not in today');
  doc.querySelector('.upcoming details').open = false;
}

try {
  await run();
} catch (err) {
  failures.push(`threw: ${err?.name} ${err?.message}`);
}
window.__result = failures.length ? `FAIL\n${failures.join('\n')}` : `PASS${skipped.length ? ` (skipped: ${skipped.join('; ')})` : ''}`;
document.getElementById('out').textContent = window.__result;
fetch('/__result', { method: 'POST', body: window.__result }).catch(() => {});
</script>
