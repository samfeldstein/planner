<!doctype html>
<meta charset="utf-8">
<title>Save with a new group</title>
<pre id="out">running…</pre>
<iframe id="app" style="width:400px;height:700px"></iframe>
<script type="module">
// Regression: in the edit sheet, typing a new group name and tapping Save must create the group and
// put the todo in it, both by click and by a tap while the name field still has the keyboard up.
// Picking an existing group and saving must keep working.
import { createIdbAdapter } from '../../src/js/data/db.js';
import { todayLocal } from '../../src/js/core/date.js';

const failures = [];
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, what, ms = 8000) {
  for (let t = 0; t < ms; t += 50) {
    const v = await fn();
    if (v) return v;
    await wait(50);
  }
  failures.push(`timed out waiting for ${what}`);
  return null;
}

async function run() {
  await new Promise((res) => { const r = indexedDB.deleteDatabase('planner'); r.onsuccess = r.onerror = r.onblocked = res; });
  localStorage.removeItem('planner:finished');

  const due = todayLocal();
  const stamp = new Date().toISOString();
  const adapter = createIdbAdapter();
  const todo = (id, title) => ({ store: 'todos', type: 'put', value: {
    id, title, due, part: 'morning', groupId: null, priority: 0,
    recur: null, lastDone: null, createdAt: stamp, updatedAt: stamp,
  } });
  await adapter.commit([todo('by-click', 'Buy milk'), todo('by-tap', 'Call mom'), todo('existing', 'Water plants')]);

  const frame = document.getElementById('app');
  frame.src = '../../src/index.html';
  await new Promise((r) => { frame.onload = r; });
  const win = frame.contentWindow;
  win.addEventListener('error', (e) => failures.push(`page error: ${e.message}`));
  win.addEventListener('unhandledrejection', (e) => failures.push(`unhandled rejection: ${e.reason}`));
  const doc = frame.contentDocument;
  if (!await until(() => doc.querySelector('.row[data-id="by-click"]'), 'the todo rows')) return;

  const sheet = doc.getElementById('sheet');
  const groupEl = doc.getElementById('group');
  const nameEl = doc.getElementById('newGroup');
  const saveBtn = doc.getElementById('submitBtn');
  const load = async (id) => {
    const data = await adapter.load();
    const t = data.todos.find((x) => x.id === id);
    return { todo: t, group: data.groups.find((g) => g.id === t?.groupId) };
  };

  async function openAndName(id, name) {
    doc.dispatchEvent(new win.CustomEvent('planner:edit', { detail: { id } }));
    if (!await until(() => sheet.open, `the edit sheet for ${id}`)) return false;
    groupEl.value = '__new__';
    groupEl.dispatchEvent(new win.Event('change', { bubbles: true }));
    if (nameEl.hidden) { failures.push('new group field did not show'); return false; }
    if (doc.activeElement !== nameEl) failures.push('new group field was not focused');
    nameEl.value = name;
    nameEl.dispatchEvent(new win.Event('input', { bubbles: true }));
    return true;
  }

  // 1. Save by click.
  if (!await openAndName('by-click', 'Errands')) return;
  saveBtn.click();
  const a = await until(async () => { const r = await load('by-click'); return r.group ? r : null; }, 'Save by click to set a group');
  if (a && a.group.name !== 'Errands') failures.push(`click: group is "${a.group.name}", not "Errands"`);
  await until(() => !sheet.open, 'the sheet to close after Save by click');

  // 2. Save by tap with the name field focused (touchend submits; no click needed).
  if (!await openAndName('by-tap', 'Family')) return;
  nameEl.focus();
  const at = (type) => {
    const touch = new win.Touch({ identifier: 1, target: saveBtn, clientX: 10, clientY: 10 });
    const list = type === 'touchend' ? [] : [touch];
    saveBtn.dispatchEvent(new win.TouchEvent(type, { bubbles: true, cancelable: true, touches: list, targetTouches: list, changedTouches: [touch] }));
  };
  at('touchstart');
  at('touchend');
  const b = await until(async () => { const r = await load('by-tap'); return r.group ? r : null; }, 'Save by tap to set a group');
  if (b && b.group.name !== 'Family') failures.push(`tap: group is "${b.group.name}", not "Family"`);
  await until(() => !sheet.open, 'the sheet to close after Save by tap');

  // 3. An existing group and Save still work.
  doc.dispatchEvent(new win.CustomEvent('planner:edit', { detail: { id: 'existing' } }));
  if (!await until(() => sheet.open, 'the edit sheet for existing')) return;
  const errands = [...groupEl.options].find((o) => o.text === 'Errands');
  if (!errands) { failures.push('Errands is not in the group list'); return; }
  groupEl.value = errands.value;
  groupEl.dispatchEvent(new win.Event('change', { bubbles: true }));
  saveBtn.click();
  const c = await until(async () => { const r = await load('existing'); return r.group ? r : null; }, 'Save with an existing group');
  if (c && c.group.name !== 'Errands') failures.push(`existing: group is "${c.group.name}"`);
  const groups = (await adapter.load()).groups;
  if (groups.length !== 2) failures.push(`expected 2 groups, found ${groups.length}`);
}

try {
  await run();
} catch (err) {
  failures.push(`threw: ${err?.name} ${err?.message}`);
}
window.__result = failures.length ? `FAIL\n${failures.join('\n')}` : 'PASS';
document.getElementById('out').textContent = window.__result;
fetch('/__result', { method: 'POST', body: window.__result }).catch(() => {});
</script>
